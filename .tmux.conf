unbind r
bind r source ~/.tmux.conf

unbind x
bind x kill-pane

unbind &
bind b kill-window

set -g prefix C-Space 
set -g mouse on

set -g xterm-keys on
set -g escape-time 0

set -g base-index 1 # start windows numbering at 1
set -g pane-base-index 1 # start windows numbering at 1


# set -g window-style 'fg=colour247,bg=colour233'
unbind c
# Set new windows and panes to open in the directory of the current pane
bind c new-window -c "${pane_current_path}"

unbind g
bind g new-window "cd /Users/danni/pay/pay-receivables && exec \$SHELL"
bind '"' split-window -v -c "#{pane_current_path}"
unbind ';'
bind ';' split-window -h -c "#{pane_current_path}"

# Resize panes (Alt + hjkl, no prefix needed)
bind -n M-h resize-pane -L 10
bind -n M-j resize-pane -D 10
bind -n M-k resize-pane -U 10
bind -n M-l resize-pane -R 10
# Show pane borders at the top
set -g pane-border-status top

# Thin borders globally; active pane stands out via color + arrows
set -g pane-border-lines single
set -g pane-border-indicators both

# Border colors: muted peach for inactive, bold orange for active (same warm family)
set -g pane-border-style fg=colour137
set -g pane-active-border-style "fg=colour208,bold"

set -g pane-border-format \
'#{?pane_active,#[fg=colour208#,bold],#[fg=colour137]}#{pane_title}'
set -g status-bg "colour236"
set -g status-fg "colour208"

# Double-tap a digit (1-9) to switch to that window — no prefix.
# First digit is sent to the pane; on second press within 400ms we send
# BSpace to undo it, then jump windows. Modal apps (vim normal, less)
# may briefly act on the first digit.
bind -n 1 if -F '#{==:#{@dt_last},1}' { send-keys BSpace ; select-window -t 1 ; set -g @dt_last '' } { send-keys 1 ; set -g @dt_last '1' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 2 if -F '#{==:#{@dt_last},2}' { send-keys BSpace ; select-window -t 2 ; set -g @dt_last '' } { send-keys 2 ; set -g @dt_last '2' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 3 if -F '#{==:#{@dt_last},3}' { send-keys BSpace ; select-window -t 3 ; set -g @dt_last '' } { send-keys 3 ; set -g @dt_last '3' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 4 if -F '#{==:#{@dt_last},4}' { send-keys BSpace ; select-window -t 4 ; set -g @dt_last '' } { send-keys 4 ; set -g @dt_last '4' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 5 if -F '#{==:#{@dt_last},5}' { send-keys BSpace ; select-window -t 5 ; set -g @dt_last '' } { send-keys 5 ; set -g @dt_last '5' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 6 if -F '#{==:#{@dt_last},6}' { send-keys BSpace ; select-window -t 6 ; set -g @dt_last '' } { send-keys 6 ; set -g @dt_last '6' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 7 if -F '#{==:#{@dt_last},7}' { send-keys BSpace ; select-window -t 7 ; set -g @dt_last '' } { send-keys 7 ; set -g @dt_last '7' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 8 if -F '#{==:#{@dt_last},8}' { send-keys BSpace ; select-window -t 8 ; set -g @dt_last '' } { send-keys 8 ; set -g @dt_last '8' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }
bind -n 9 if -F '#{==:#{@dt_last},9}' { send-keys BSpace ; select-window -t 9 ; set -g @dt_last '' } { send-keys 9 ; set -g @dt_last '9' ; run-shell -b 'sleep 0.4; tmux set -g @dt_last ""' }

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
