unbind r
bind r source ~/.tmux.conf

unbind x
bind x kill-pane

unbind &
bind b kill-window

set -g prefix C-Space 
set -g mouse on

set -g xterm-keys on
set -g escape-time 0

set -g base-index 1 # start windows numbering at 1
set -g pane-base-index 1 # start windows numbering at 1


# set -g window-style 'fg=colour247,bg=colour233'
unbind c
# Set new windows and panes to open in the directory of the current pane
bind c new-window -c "${pane_current_path}"

unbind g
bind g new-window "cd /Users/danni/pay/pay-receivables && exec \$SHELL"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# Show pane borders at the top
set -g pane-border-status top

# Border colors
set -g pane-border-style fg=colour219
set -g pane-active-border-style fg=colour75

set -g pane-border-format \
'#{?pane_active,#[fg=colour75],#[fg=colour219]}#{pane_title}'
set -g status-bg "#6699CC"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

run '~/.tmux/plugins/tpm/tpm'
